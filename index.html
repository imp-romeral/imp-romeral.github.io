<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>IMP Romeral</title>
<meta name="description" content="Control de culto y actividades · Iglesia Metodista Pentecostal Romeral">
<meta name="theme-color" content="#f7eef1">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="iconos/favicon-48.png">
<link rel="apple-touch-icon" href="iconos/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="IMP Romeral">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
  /* Colores del logo: rosa, crema, lila y menta */
  :root { --azul: #062a43; --azul2: #0b4d6f; --fondo: #f3f3f1; --texto: #1c2630; --rosa: #b98393; --rosa2: #8c5d6c; --crema: #f7eef1; }
  html, body { margin: 0; height: 100%; background: var(--crema); }
  body {
    display: flex; flex-direction: column; box-sizing: border-box;
    padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: var(--texto);
  }
  #app { flex: 1; width: 100%; border: 0; display: block; background: var(--fondo); }
  .oculto { display: none !important; }

  /* Pantalla de inicio: el logo de la iglesia sobre un fondo suave con sus mismos colores (rosa, crema, lila y menta).
     Sigue sin corte al inicio que muestra el celular (fondo #f7eef1 en manifest.json) */
  #carga {
    position: fixed; inset: 0; z-index: 5; overflow: hidden; color: var(--rosa2); text-align: center;
    display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 32px 24px;
    background:
      radial-gradient(60% 45% at 12% 18%, rgba(205, 190, 228, .55) 0%, rgba(205, 190, 228, 0) 70%),
      radial-gradient(55% 40% at 90% 85%, rgba(190, 228, 214, .55) 0%, rgba(190, 228, 214, 0) 70%),
      radial-gradient(50% 40% at 92% 12%, rgba(250, 214, 190, .5) 0%, rgba(250, 214, 190, 0) 70%),
      radial-gradient(120% 90% at 50% 45%, #fffbf8 0%, #fbf3f2 45%, #f3e6ea 100%);
    transition: opacity .55s ease, visibility .55s;
  }
  #carga.oculto { display: flex !important; opacity: 0; visibility: hidden; pointer-events: none; }
  .ini { position: relative; display: flex; flex-direction: column; align-items: center; }
  /* El logo tiene fondo blanco: "multiply" lo funde con el fondo de la pantalla */
  .ini img { width: min(78vw, 360px); height: auto; mix-blend-mode: multiply; animation: aparece 1s ease-out both; }
  .ini em { margin-top: 14px; font-style: normal; font-size: 13px; letter-spacing: .4px; color: var(--rosa2); animation: sube .9s .45s ease-out both; }
  /* Barra de avance fina y rosada al pie */
  .avance { position: absolute; left: 50%; bottom: calc(48px + env(safe-area-inset-bottom)); width: 120px; height: 3px; margin-left: -60px; border-radius: 3px; background: rgba(140, 93, 108, .14); overflow: hidden; }
  .avance i { position: absolute; top: 0; bottom: 0; width: 40%; border-radius: 3px; background: var(--rosa); animation: corre 1.3s ease-in-out infinite; }
  @keyframes aparece { from { opacity: 0; transform: scale(.88); } to { opacity: 1; transform: none; } }
  @keyframes sube { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  @keyframes corre { from { left: -40%; } to { left: 100%; } }
  @media (prefers-reduced-motion: reduce) { #carga *, #carga { animation: none !important; transition: none !important; } }
  #cargaTxt:empty { display: none; }
  #cargaTxt { margin-top: 18px; font-size: 13.5px; color: var(--rosa2); font-weight: 600; }
  #lento { margin-top: 12px; font-size: 13px; color: var(--rosa2); max-width: 300px; line-height: 1.45; position: relative; }
  .boton {
    display: inline-block; border: 0; border-radius: 10px; padding: 10px 16px; font: inherit; font-size: 14px; font-weight: 700;
    background: var(--azul2); color: #fff; text-decoration: none; cursor: pointer;
  }
  .boton.claro { background: #fff; color: var(--rosa2); }
  #carga .boton { background: var(--rosa2); }

  /* Aviso para instalar la app (sólo en el navegador, no dentro de la app instalada) */
  #instalar {
    display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--rosa2); color: #fff; font-size: 13px; line-height: 1.35;
  }
  #instalar img { width: 34px; height: 34px; border-radius: 8px; background: #fff; flex: none; }
  #instalar span { flex: 1; min-width: 0; }
  #instalar .x { flex: none; border: 0; background: transparent; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }

  /* Aviso para activar las notificaciones (mismo estilo que el de instalar, en azul) */
  #notif { display: flex; align-items: center; gap: 10px; padding: 9px 12px; background: var(--azul); color: #fff; font-size: 13px; line-height: 1.35; }
  #notif img { width: 34px; height: 34px; border-radius: 8px; background: #fff; flex: none; }
  #notif span { flex: 1; min-width: 0; }
  #notif .boton.claro { color: var(--azul); }
  #notif .x { flex: none; border: 0; background: transparent; color: #fff; font-size: 22px; line-height: 1; cursor: pointer; padding: 2px 6px; }
</style>
</head>
<body>
  <div id="instalar" class="oculto" role="region" aria-label="Instalar la app">
    <img src="iconos/icono-192.png" alt="">
    <span id="instalarTxt"></span>
    <button type="button" id="instalarBtn" class="boton claro oculto">Instalar</button>
    <button type="button" class="x" id="instalarX" aria-label="Cerrar aviso">×</button>
  </div>

  <div id="notif" class="oculto" role="region" aria-label="Activar notificaciones">
    <img src="iconos/icono-192.png" alt="">
    <span id="notifTxt">¿Quiere recibir en su celular los cumpleaños y las actividades destacadas?</span>
    <button type="button" id="notifBtn" class="boton claro">🔔 Activar</button>
    <button type="button" class="x" id="notifX" aria-label="Cerrar aviso">×</button>
  </div>

  <iframe id="app" title="Iglesia Metodista Pentecostal Romeral" allow="clipboard-write; fullscreen"></iframe>

  <div id="carga" aria-live="polite">
    <div class="ini">
      <img src="iconos/logo-inicio.webp" alt="Iglesia Metodista Pentecostal de Chile · Romeral">
      <em>Control de culto y actividades</em>
      <span id="cargaTxt"></span>
      <div id="lento" class="oculto"></div>
    </div>
    <div class="avance" id="rueda" aria-hidden="true"><i></i></div>
  </div>

<script>
  /* ============================================================
     ÚNICO DATO A COMPLETAR: el link de la app publicada en Apps Script
     (Gestionar implementaciones → copiar la "URL de la aplicación web", termina en /exec)
     ============================================================ */
  const URL_APP = 'https://script.google.com/macros/s/AKfycbyMci91qjgsOp6WHFYzZWaO2W-YzAvHkKFbIdKKaTu4OvGkr0ezjBe0-ooysKE1bAhz/exec';

  const $ = id => document.getElementById(id);
  const app = $('app'), carga = $('carga');
  const configurado = /^https:\/\/script\.google\.com\/macros\/s\/[\w-]+\/exec/.test(URL_APP);

  function mostrarLento(html) { $('lento').innerHTML = html; $('lento').classList.remove('oculto'); }
  function quitarCarga() { carga.classList.add('oculto'); }

  function abrir() {
    if (!configurado) {
      $('rueda').classList.add('oculto');
      $('cargaTxt').textContent = 'Falta poner el link de la app.';
      mostrarLento('Escriba el link de Apps Script (termina en /exec) en la línea URL_APP de este archivo.');
      return;
    }
    if (!navigator.onLine) {
      $('rueda').classList.add('oculto');
      $('cargaTxt').textContent = 'Sin conexión a internet.';
      mostrarLento('<button type="button" class="boton" onclick="location.reload()">Volver a intentar</button>');
      return;
    }
    carga.classList.remove('oculto');
    // La pantalla de inicio se quita cuando la app avisa que terminó de cargar, o a los 4 segundos como máximo
    setTimeout(quitarCarga, 4000);
    app.src = URL_APP;
  }
  window.addEventListener('online', () => { if (!app.src) location.reload(); });
  // Aviso de la app (App.html): sólo se acepta desde las páginas de Apps Script
  window.addEventListener('message', e => {
    let origen = '';
    try { origen = new URL(e.origin).hostname; } catch (x) {}
    if (e.data === 'romeral-lista' && /\.googleusercontent\.com$/.test(origen)) quitarCarga();
  });

  /* Aviso para instalar: Android muestra el botón Instalar; iPhone necesita el menú Compartir de Safari */
  const instalada = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
  const esIOS = /iphone|ipad|ipod/i.test(navigator.userAgent) || (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
  let cerrado = false;
  try { cerrado = localStorage.getItem('romeral_instalar_cerrado') === '1'; } catch (e) {}
  let pedido = null;
  function avisar(texto, conBoton) {
    if (instalada || cerrado) return;
    $('instalarTxt').textContent = texto;
    $('instalarBtn').classList.toggle('oculto', !conBoton);
    $('instalar').classList.remove('oculto');
  }
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); pedido = e; avisar('Instale la app de la iglesia en su celular.', true); });
  $('instalarBtn').addEventListener('click', async () => {
    if (!pedido) return;
    pedido.prompt();
    try { await pedido.userChoice; } catch (e) {}
    pedido = null; $('instalar').classList.add('oculto');
  });
  $('instalarX').addEventListener('click', () => {
    $('instalar').classList.add('oculto');
    try { localStorage.setItem('romeral_instalar_cerrado', '1'); } catch (e) {}
  });
  window.addEventListener('appinstalled', () => $('instalar').classList.add('oculto'));
  if (esIOS) avisar('Para instalarla: pulse Compartir y luego «Agregar a inicio».', false);

  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  abrir();

  /* ============================================================
     NOTIFICACIONES (Firebase). Apps Script (Push.gs) las envía a las 8 de la mañana:
     cumpleaños del día y actividades destacadas (2 días antes, 1 día antes y el mismo día).
     Estos datos de Firebase no son secretos: la llave secreta está sólo en Apps Script.
     ============================================================ */
  const FIREBASE = {
    apiKey: 'AIzaSyCpznVQVPKrPi3ZgtcN3uXV2npu7erHIVk',
    authDomain: 'imp-script.firebaseapp.com',
    projectId: 'imp-script',
    storageBucket: 'imp-script.firebasestorage.app',
    messagingSenderId: '419218801500',
    appId: '1:419218801500:web:232e8d034c2c1dfb1c7799'
  };
  const VAPID = 'BK4YfeRFkv9jVeoDTxovFY8tY444ABefFrBTrndlLuxr7At0mBkNT4JXZw30GrO9QM31iWeq-s3uQO2n8I6u4mk';
  const FIREBASE_JS = 'https://www.gstatic.com/firebasejs/10.12.2/';

  // En iPhone sólo funciona con la app agregada a la pantalla de inicio (ahí sí existe PushManager)
  const conPush = 'serviceWorker' in navigator && 'PushManager' in window && 'Notification' in window;
  const leer = k => { try { return localStorage.getItem(k); } catch (e) { return null; } };
  const guardar = (k, v) => { try { localStorage.setItem(k, v); } catch (e) {} };

  function cargarScript(src) {
    return new Promise((ok, mal) => {
      const s = document.createElement('script');
      s.src = src; s.onload = ok; s.onerror = () => mal(new Error('No se pudo cargar ' + src));
      document.head.appendChild(s);
    });
  }
  let firebaseListo = null;
  function cargarFirebase() {
    if (!firebaseListo) {
      firebaseListo = cargarScript(FIREBASE_JS + 'firebase-app-compat.js')
        .then(() => cargarScript(FIREBASE_JS + 'firebase-messaging-compat.js'))
        .then(() => { if (!firebase.apps.length) firebase.initializeApp(FIREBASE); });
    }
    return firebaseListo;
  }
  function equipo() {
    const ua = navigator.userAgent;
    return (esIOS ? 'iPhone' : /android/i.test(ua) ? 'Android' : 'Computador') + (instalada ? ' (app)' : '');
  }
  /* Pide el código del celular a Firebase y se lo manda a Apps Script (doPost en Push.gs).
     Se repite una vez al día, porque Firebase a veces cambia el código. */
  async function registrarPush(forzar) {
    await cargarFirebase();
    const reg = await navigator.serviceWorker.ready;
    const token = await firebase.messaging().getToken({vapidKey: VAPID, serviceWorkerRegistration: reg});
    if (!token) throw new Error('Firebase no entregó el código');
    const hoy = new Date().toISOString().slice(0, 10);
    if (!forzar && leer('romeral_push_token') === token && leer('romeral_push_dia') === hoy) return token;
    await fetch(URL_APP, {method: 'POST', mode: 'no-cors', body: JSON.stringify({accion: 'registrar', token, equipo: equipo()})});
    guardar('romeral_push_token', token);
    guardar('romeral_push_dia', hoy);
    return token;
  }

  function mostrarNotif() { $('notif').classList.remove('oculto'); }
  function ocultarNotif() { $('notif').classList.add('oculto'); }
  $('notifX').addEventListener('click', () => { ocultarNotif(); guardar('romeral_push_cerrado', String(Date.now())); });
  $('notifBtn').addEventListener('click', async () => {
    const btn = $('notifBtn');
    btn.disabled = true;
    let permiso = 'default';
    try { permiso = await Notification.requestPermission(); } catch (e) {}
    if (permiso !== 'granted') {
      $('notifTxt').textContent = permiso === 'denied'
        ? 'Las notificaciones quedaron bloqueadas. Puede activarlas en los ajustes del celular → Notificaciones.'
        : 'No se activaron. Puede intentarlo cuando quiera.';
      btn.classList.add('oculto');
      setTimeout(ocultarNotif, 6000);
      return;
    }
    $('notifTxt').textContent = 'Activando…';
    try {
      await registrarPush(true);
      $('notifTxt').textContent = '✓ Listo. Le avisaremos a las 8 de la mañana.';
      btn.classList.add('oculto');
      setTimeout(ocultarNotif, 4000);
    } catch (e) {
      console.error(e);
      $('notifTxt').textContent = 'No se pudo activar (revise su conexión). Intente de nuevo.';
      btn.disabled = false;
    }
  });

  if (conPush && configurado) {
    if (Notification.permission === 'granted') {
      // Ya estaban activadas: se renueva el código en silencio, un rato después de abrir
      setTimeout(() => registrarPush(false).catch(e => console.error(e)), 5000);
    } else if (Notification.permission === 'default') {
      // Si cerró el aviso, se vuelve a ofrecer a los 15 días
      const cerradoPush = Number(leer('romeral_push_cerrado') || 0);
      if (Date.now() - cerradoPush > 15 * 864e5) setTimeout(mostrarNotif, 2500);
    }
  }
</script>
</body>
</html>
